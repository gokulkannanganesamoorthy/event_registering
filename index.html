<!doctype html>
<html lang="en">
  <head>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="EventSphere | Where Moments Become Movements" />

    <!-- Favicon -->

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EventSphere",
      "url": "https://eventsphere.app",
      "description": "Discover extraordinary events or host your own. EventSphere connects event creators with passionate audiences.",

        "@type": "SearchAction",
        "target": "https://eventsphere.app/events?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
